name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Disable telemetry / interactive prompts in CI.
  CI: true
  HUSKY: 0

jobs:
  quality:
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Keep in sync with docker-compose.yml
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: mom
          POSTGRES_PASSWORD: mom
          POSTGRES_DB: mom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mom -d mom_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://mom:mom@localhost:5432/mom_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations match the schema
        # Fails if someone changed src/db/schema without committing the generated migration.
        run: |
          npm run db:generate -w @mom/api
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            git status --porcelain apps/api/drizzle
            echo "::error::Schema changed without a migration. Run 'npm run db:generate -w @mom/api' and commit apps/api/drizzle."
            exit 1
          fi
      - name: Apply migrations to an empty database
        run: npm run db:migrate -w @mom/api
        env:
          DATABASE_URL: postgres://mom:mom@localhost:5432/mom_test
      - name: Integration tests
        run: npm run test:int

  docker-api:
    name: API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t mom-api:ci .
      - name: Smoke test (no database → alive but not ready)
        run: |
          docker run -d --name api -p 4000:4000 \
            -e NODE_ENV=production -e SMS_PROVIDER=aws \
            -e DATABASE_URL=postgres://mom:mom@127.0.0.1:1/mom \
            -e S3_BUCKET=mom-images -e PUBLIC_IMAGE_BASE_URL=https://img.example.com \
            -e JWT_SECRET=ci-only-jwt-secret-not-used-anywhere-0123456789 \
            -e OTP_PEPPER=ci-only-otp-pepper-not-used-anywhere-9876543210 \
            -e QR_SECRET=ci-only-qr-secret-not-used-anywhere-0011223344 \
            -e AWS_SMS_ORIGINATION_IDENTITY=CITEST -e AWS_SMS_DLT_ENTITY_ID=0 -e AWS_SMS_DLT_TEMPLATE_ID=0 \
            mom-api:ci
          for i in $(seq 1 30); do curl -fs localhost:4000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/ready)" = 503
          test "$(docker exec api id -u)" = 1000
      - name: Image size
        if: always()
        run: docker image ls mom-api:ci --format 'mom-api:ci {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: failure()
        run: docker logs api

  e2e:
    name: End-to-end tests (Playwright)
    # Turned on in #6 (planned for #11): the design system and app shell already have pages to test.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tests sign in through the real API, so they need Postgres (the API itself is
    # started by Playwright, see apps/web/playwright.config.ts).
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: mom
          POSTGRES_PASSWORD: mom
          POSTGRES_DB: mom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mom -d mom_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Menu photos are uploaded to S3; locally and here that's SeaweedFS (docker-compose.yml).
      # A plain `docker run`, because service containers can't be given a command.
      - name: Start S3 storage (SeaweedFS)
        run: |
          docker run -d --name mom_s3 -p 127.0.0.1:8333:8333 \
            -v "$PWD/docker/s3/s3.json:/etc/mom/s3.json:ro" \
            chrislusf/seaweedfs:4.54 mini -dir=/data -bucket=mom-images \
            -s3.config=/etc/mom/s3.json -admin.ui=false
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8333/healthz && exit 0
            sleep 1
          done
          docker logs mom_s3
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the web app, start the API, run the browser tests
        run: npm run e2e -w @mom/web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
